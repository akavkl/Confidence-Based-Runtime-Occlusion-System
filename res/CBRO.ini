; Confidence-Based Runtime Occlusion (CBRO)
; Log: Documents\My Games\Fallout4\F4SE\CBRO.log

[General]
; Master switch. 0 = load the DLL but install no hooks.
bEnabled=1

[Occlusion]
; CBRO culls hidden objects from the main camera pass using the previous frames' depth.
bEnabled=1
; 1 = CBRO replaces previs: CBRO on -> previs off, CBRO off -> previs on, managed by this mod (the
;     console command `tpc` also flips the pair). Precombines always stay on.
; 0 = never touch previs (testing only; pre-generated previs can wrongly hide objects, which is why CBRO
;     replaces it).
bDisablePrevis=1
; 1 = previs is never switched off or flushed. While CBRO is on it is SUSPENDED through the engine's own flush-free
;     switch (the one its shadow cascades use every frame): the engine walks the scene as with previs off and CBRO
;     culls; the toggle key back to previs gets full-strength previs at once. bDisablePrevis is then ignored. This is
;     the "previs feed" branch's first stage (PREVIS-FEED-PLAN.md); CBRO filling the engine's previs lists itself comes
;     later, once the audit below is clean.
; 0 = v1.28 behaviour: previs is switched off, which flushes it; previs mode then stays weakened until the cells reload.
bPrevisFeed=1
; Every N frames in CBRO mode, CBRO's replica of the engine's scene walk (the input of the coming feed mode) is
; compared with what the engine actually filed that frame: log line "feed audit". 0 = off.
iFeedAuditInterval=600
; Interiors and other override-root scenes. 1 = CBRO culls them (v1.28 did). 0 = CBRO stands by there (previs mode,
; nothing touched) and resumes in exteriors.
bInteriors=1
; How previs is handled indoors while CBRO is on. 1 = v1.28's way: previs is switched off (the engine flushes its
; lists) on entering the interior in CBRO mode and back on when CBRO goes off or the exterior returns; previs mode
; indoors is then the engine without previs until the cell reloads, as in v1.28. 0 = the exterior's way (previs
; suspended only inside CBRO's cull windows, never switched off). v1.31-v1.37 used 0 indoors; v1.28 used 1.
; With 1 (and bPrevisFeed=1) previs is switched off when a loading screen opens while CBRO is on, so the cells
; attach with previs inactive as they did in v1.28 (an interior attached with previs active keeps its lamps dark
; once previs goes off: the engine's previs-off setup of rooms and lights only runs while previs is inactive);
; after the load an exterior gets previs back for the windows. The very first load after the game starts is not
; covered (as v1.28): a save that starts in an interior needs one more load for its lamps.
bInteriorLegacyPrevis=1
; Interiors: 1 = judge through the worker there too (bAsync). 0 = judge inside the walk, as v1.28 did.
bAsyncInteriors=0
; Diagnostic: at each A/B location, the main-view objects each mode registers are collected over settled frames and
; the two sets compared ("set diff" lines: what CBRO draws that previs never does here, and the reverse, by type,
; size and distance). Needs an F8 round trip at the spot. Costs one append per registration in both modes.
bSetDiff=0
; Asynchronous verdicts. 1 = the engine's scene walk only looks each object's verdict up in a map and records the
; object; a worker thread judges all of them after the cull (same tests, same confirmation) into the map the next
; frame reads, while the rest of the frame renders. The main thread's per-object work drops to a lookup. A verdict is
; used only while the camera stays within the movement and turn the worker allowed for (log line "async per
; interval"). 0 = v1.35 behaviour: every object judged inside the walk, on the main thread.
bAsync=1
; With the sun off (interiors, night), group 0 is read by the spot lights' shadow passes. 1 = an entry the main view
; doesn't need is left out of group 0 when no shadow-casting lamp (point or spot, recorded each frame) can cast a
; visible shadow of it (the shadow-volume test against the depth). 0 = every entry stays in group 0 with the sun off
; (v1.32-v1.36: the spot lights' shadow maps then draw the whole cell within their cone).
bLampGroupTrim=0
; With previs active the engine marks lights previs deems unseen as occluded (BSLight::bOccluded) and unmarks them
; through the same previs-gated code; with previs inactive for CBRO's walk nothing unmarks them, and the deferred-
; lights stage skips an occluded lamp entirely: no shadow map, no light (the dark lamps of v1.31-v1.41). 1 = clear
; the mark on every light before that stage in CBRO frames (the state vanilla has with previs off). 0 = leave it.
bUnoccludeLights=1
; Diagnostic: 1 = log what the engine's shadow-light loop decides for each shadow light in CBRO frames (which test
; drops a lamp: hidden, occluded, room set, its own Update, fade, queue slot, shadow-map slice) and a few of the
; lamps that did not render, per interval. Hooks the lights' Update(camera). 0 = off.
bLampDiagnostic=1
; 1 = CBRO takes over as soon as a game is loaded (previs off). 0 = start in previs mode and leave previs
;     untouched until the toggle key is pressed. Use 0 for the "does CBRO's presence alone cost frame time" test:
;     at one save and view, standing still, compare the overlay FPS of
;       (1) CBRO unticked in MO2                  (2) [General] bEnabled=0   (DLL loaded, nothing installed)
;       (3) [Occlusion] bEnabled=0 (only the two render-stage call sites are hooked)
;       (4) bStartActive=0 (everything installed, previs never switched)
;       (5) default (previs switched off at load and back on with the toggle key).
;     The first rung that is slower than the one before it names the cause.
bStartActive=1
; 1 = compute decisions and log them, but never drop anything (safe validation run).
bObserveOnly=0
; Diagnostic state at load (the same states the diagnostic hotkey cycles): 0 = normal; 1 = decide-only, nothing is
; hidden anywhere (main view, lamps, nodes, merged meshes); 2 = decide-only AND no depth capture (CBRO's GPU work off:
; only the hooks remain, passing everything through). The log's "settings:" line and a "diagnostic state at load" line
; confirm what ran.
iStartDiagnostic=0
; Virtual-key code (decimal) that flips the pair at runtime (CBRO <-> previs) for A/B comparison. 119 = F8.
iToggleHotkey=119
; Optional keys, unbound by default (0) so they cannot clash with other mods. Set a virtual-key code to use them.
; Shows the current mode and how many objects and lights CBRO is hiding.
iStatusHotkey=0
; Cycles diagnostic modes: normal -> decide-only (nothing hidden) -> decide-only without depth capture.
iDiagnosticHotkey=0
; On-screen message whenever the mode changes (load, F8, `tpc`, or CBRO unavailable).
bNotify=1
; Depth pixels per Hi-Z texel edge. 4 = 1280x800 depth -> 320x200 Hi-Z.
iHiZDownsample=4
; An object must test hidden this many frames in a row before it is hidden (one visible frame restores it).
iConfirmFrames=2
; Depth older than this many frames is not used.
iMaxSnapshotAge=6
; If the camera moved/turned more than this since the depth was rendered, nothing is culled that frame.
; Turning alone can't reveal hidden objects; the angle limit only keeps the rejection point behind the camera (max 80).
fMaxCameraMove=256.0
fMaxCameraAngle=60.0
; Anything reaching within this view depth of the camera (game units) is always drawn.
fNearDistance=8.0
; 1 = NPC and creature parts may be hidden too when they are behind walls (only from the main camera: their
; shadows keep being drawn). 0 = never hide actors.
bCullActors=1
; 1 = big static meshes (precombined chunks, LOD blocks, terrain) are judged by their actual geometry: the
; box around their vertices and a coarse grid of the cells their triangles occupy, built once per mesh in
; the background. A cell-sized mesh is then hidden when all of its occupied cells are, not only when its
; whole bounding sphere is. 0 = spheres only.
bMeshShapes=1
; 1 = an object hidden from the camera is also left out of the sun's shadow maps when its shadow could only
; fall outside the view or behind visible surfaces (then the engine never walks it at all). Objects whose
; shadow may be seen always keep casting it. 0 = every shadow caster stays in the sun's shadow maps.
bSunShadowCulling=1
; 1 = casters are left out of a lamp's shadow map when they are too far outside the view to shadow anything
; visible (a lamp inside the view needs only the casters inside it). 0 = lamps keep every caster.
bLampShadowCulling=1
; 1 = a caster is also left out of a lamp's shadow map when its shadow volume (the cone from the lamp through
;     it, out to the lamp's reach) lies entirely behind, or entirely in front of, every visible surface, or
;     outside the view: it can't darken a visible pixel. Judged against the nearest and farthest depth per
;     texel, confirmed over iConfirmFrames frames. 0 = only the view-cone test above.
bLampShadowVolumes=1
; 1 = a spot light whose lit volume (its shadow frustum, or its whole reach) lies entirely behind visible surfaces,
;     confirmed over iConfirmFrames frames, renders an empty shadow map: none of its casters is drawn. The light
;     itself still renders. Previs does this by marking such lights occluded. 0 = spot lights keep every caster.
bSpotShadowCulling=1
; 1 = in a CBRO frame with previs kept on (bPrevisFeed=1), previs is suspended around each spot light's shadow-map cull
;     that reads the shared caster group, as around the sun's cascades. With previs active there the engine skips that
;     cull's frustum test and draws whatever the previous view left (the last sun cascade's casters, or the main
;     view's): casters inside the spot light's view went missing from its shadow map. 0 = the engine's behaviour.
bSpotCullWindow=1
; 1 = a spot light whose shadow map is drawn leaves out the casters that can't shadow a visible pixel, with the same two
;     tests the lamp casters get above (outside the view cone pushed out to the light; shadow volume behind or in front
;     of every visible surface, confirmed over iConfirmFrames frames). 0 = spot lights keep every caster of their view.
bSpotCasterTrim=1
; 1 = a cell's static-object node (its precombined chunks and static refs) whose whole bound lies outside the
;     view, and whose sun shadow can't reach the view, is never walked: none of its objects is filed with the
;     engine's culling groups (previs mode drops out-of-view cell roots whole the same way, without the shadow
;     condition). 0 = every cell's objects are walked and judged one by one.
bCellNodePruning=1
; 1 = an object's verdict is reused from the previous frame while nothing it depended on changed: the camera
;     (and the depth frame's camera) within fCacheMove units and fCacheAngle degrees of where the reuse period
;     began, the object's own bound unchanged, the sun unchanged. A hidden verdict is also re-checked against
;     the current depth whenever the depth under it changed (one coarse query; the full test runs only if that
;     fails); a drawn object's verdict is reused whatever the depth does and re-evaluated every 16 frames.
;     Tested bounds grow by fCacheMove, and by depth x fCacheAngle, so a reused verdict stays conservative
;     inside that tolerance. Larger values reuse longer while moving but cull a little less. 0 = every object
;     is tested every frame.
bVerdictCache=1
fCacheMove=4.0
fCacheAngle=0.1
; While the camera turns, the depth the tests use (1-2 frames old) doesn't cover a thin strip of the view at the
; edge it turns toward. An object or sun shadow reaching into that strip is judged by the depth frame's edge, as
; lamps' reaches are, if the strip is at most this wide (in NDC: 0.03 is ~38 px at 2560 wide); wider, it stays
; drawn. Without this, a slight wobble kept every object crossing that edge drawn and the draw count swung hard.
; The cost: something seen only inside that strip can show up 1-2 frames late at the screen's edge mid-turn.
; 0 = never judged there (strict).
fViewOverhang=0.03
; With the camera (nearly) still, the depth the tests use is the farthest over this many consecutive frames
; (1-8). Texels on silhouette edges flip between the occluder and the background from frame to frame (sub-pixel
; jitter, swaying geometry); the merge keeps objects peeking out at such an edge steadily drawn instead of
; flickering in and out. 1 = each frame's depth alone.
iHiZTemporalFrames=4
; An object counts as hidden only if its nearest point is farther than the occluder by this fraction of the
; occluder's distance, plus fDepthSlack game units (compared in linear depth, so it stays tight at long range).
fDepthTolerance=0.002
fDepthSlack=4.0
; Viewport depth range used for world geometry (first person is drawn in [0, 0.01]).
fWorldDepthMin=0.01
fWorldDepthMax=1.0

[Probe]
; Phase 0 research instrumentation, off by default: it hooks D3D11 draw calls (inside ENB's d3d11 layer)
; and four extra render stages shared with Upscaling, which costs frame time. CBRO's own log (mode, culling
; stats, frame time, F8 A/B) works without it. 1 = on (draw counts per stage, traces, render-target dumps).
bEnabled=0
bRenderStageHooks=1
bDrawCallCounter=1
; Research probes (Phase 0 only): culling-process vtables and culling-group feeds.
bCullingHooks=0
bCullingGroupHooks=0
; Cell survey after a load and on the survey hotkey.
bSceneSurvey=0
; Log a summary every N frames.
iSummaryIntervalFrames=600
; Trace window length in frames. 0 = off.
iTraceFrames=3
iTraceDelayFramesAfterLoad=300
; Virtual-key codes (decimal). 114 = F3, 123 = F12. 0 = no hotkey.
iTraceHotkey=114
iSurveyHotkey=123
